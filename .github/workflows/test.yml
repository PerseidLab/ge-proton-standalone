steps:
  - name: Checkout
    uses: actions/checkout@v5

  - name: Enable aarch64 emulation (QEMU binfmt)
    uses: docker/setup-qemu-action@v2

  - name: Install host deps
    run: |
      sudo apt-get update
      sudo apt-get install -y libfuse2 jq tar wget dpkg ar xz-utils file

  - name: Set environment variables
    run: |
      echo "GE_VERSION=${{ github.event.inputs.ge_version }}" >> $GITHUB_ENV
      echo "DOWNLOAD_URL=${{ github.event.inputs.download_url }}" >> $GITHUB_ENV
      echo "BOX64_URL_INPUT=${{ github.event.inputs.box64_url }}" >> $GITHUB_ENV
      echo "FINAL_NAME=${{ env.FINAL_NAME }}" >> $GITHUB_ENV

  - name: Prepare AppDir and extract GE-Proton payload
    run: |
      set -eu
      rm -rf AppDir
      mkdir -p AppDir/opt/GE-Proton AppDir/usr/bin AppDir/usr/lib
      # Fetch GE tarball and extract into AppDir/opt/GE-Proton
      wget -qO archive.tar "${{ env.DOWNLOAD_URL }}"
      tar -xf archive.tar -C AppDir/opt/GE-Proton --strip-components=1
      rm archive.tar

  - name: Discover and install box64 (aarch64) into AppDir
    run: |
      set -eu
      cd "$GITHUB_WORKSPACE"
      BOX64_URL="${BOX64_URL_INPUT:-}"
      if [ -z "$BOX64_URL" ]; then
        echo "No BOX64_URL provided; querying GitHub releases for ptitSeb/box64..."
        release_json=$(curl -s https://api.github.com/repos/ptitSeb/box64/releases/latest)
        BOX64_URL=$(echo "$release_json" \
          | jq -r '.assets[].browser_download_url' \
          | egrep -i 'arm64|aarch64|armv8|aarch64|linux_arm64|arm64.deb|arm64.tar.gz|arm64.tgz|linux-aarch64|aarch64.deb' \
          | head -n1 || true)
        if [ -z "$BOX64_URL" ]; then
          BOX64_URL=$(echo "$release_json" \
            | jq -r '.assets[].browser_download_url' \
            | egrep -i '\.deb$|\.tar.gz$|\.tgz$|box64' \
            | head -n1 || true)
        fi
        if [ -z "$BOX64_URL" ]; then
          echo "Could not auto-detect a box64 release asset for arm64. Provide box64_url input to the workflow." >&2
          exit 1
        fi
        echo "Auto-detected BOX64 URL: $BOX64_URL"
      else
        echo "Using user-provided BOX64 URL: $BOX64_URL"
      fi

      TMP=box64_tmp
      mkdir -p "$TMP"
      wget -qO "$TMP/box64_asset" "$BOX64_URL"

      FILETYPE=$(file -b "$TMP/box64_asset" || true)
      echo "Downloaded asset file type: $FILETYPE"

      if file "$TMP/box64_asset" | grep -qi 'Debian binary package'; then
        echo "Detected .deb package; extracting..."
        mkdir -p "$TMP/deb"
        dpkg-deb -x "$TMP/box64_asset" "$TMP/deb"
        if [ -x "$TMP/deb/usr/bin/box64" ]; then
          install -Dm755 "$TMP/deb/usr/bin/box64" AppDir/usr/bin/box64
        else
          find "$TMP/deb" -type f -name 'box64' -executable -exec install -Dm755 {} AppDir/usr/bin/box64 \; -quit || true
        fi
      elif echo "$FILETYPE" | grep -qi 'gzip compressed data'; then
        echo "Detected tarball; extracting..."
        mkdir -p "$TMP/tar"
        tar -xzf "$TMP/box64_asset" -C "$TMP/tar" || tar -xJf "$TMP/box64_asset" -C "$TMP/tar" || true
        find "$TMP/tar" -type f -name 'box64' -executable -exec install -Dm755 {} AppDir/usr/bin/box64 \; -quit || true
      elif echo "$FILETYPE" | grep -qi 'ELF 64-bit LSB shared object' || echo "$FILETYPE" | grep -qi 'ELF 64-bit LSB executable'; then
        echo "Detected an ELF binary; installing as box64"
        install -Dm755 "$TMP/box64_asset" AppDir/usr/bin/box64
      else
        echo "Unknown asset type; attempting to treat it as raw binary"
        install -Dm755 "$TMP/box64_asset" AppDir/usr/bin/box64 || true
      fi

      if [ ! -x AppDir/usr/bin/box64 ]; then
        echo "Failed to extract or locate an executable box64 inside the downloaded asset." >&2
        ls -la "$TMP" || true
        exit 1
      fi

      chmod +x AppDir/usr/bin/box64
      echo "box64 installed to AppDir/usr/bin/box64"

  - name: Create AppRun wrapper (invokes box64)
    run: |
      set -eu
      cat > AppDir/AppRun <<'EOF'
